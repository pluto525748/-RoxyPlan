name: Offline release checks
on:
  pull_request:
  push:
    branches: [codex/aic2026-release]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - shell: pwsh
        run: ./scripts/run_isolated_tests.ps1 -PythonExecutable (Get-Command python).Source -KeepRun -PytestArgs @('tests/test_daily_growth_reference.py','tests/test_learning_context_continuity.py','tests/test_learning_dialogue_history.py','tests/test_runtime_paths.py','tests/test_feedback_export.py','-q')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-results
          path: test_workspace/runs/*/artifacts/
